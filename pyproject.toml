[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-ai-receptionist"
version = "0.1.0"
description = "A CPU-first, local English voice assistant prototype."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
  "faster-whisper>=1.1,<2",
  # faster-whisper 1.2.1 still passes metadata_errors to av.open; PyAV 19 removed it.
  "av>=11,<19",
  "fastapi>=0.115,<1",
  "kokoro-onnx>=0.6,<1",
  "llama-cpp-python>=0.3,<1",
  "numpy>=2,<3",
  "onnxruntime>=1.17,<2",
  "python-dotenv>=1,<2",
  "python-multipart>=0.0.20,<1",
  "sounddevice>=0.5,<1",
  "soundfile>=0.13,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
gemini = ["google-genai>=3.2,<4"]
livekit = ["livekit-agents[google]>=1.8.5,<2"]

[project.scripts]
ai-receptionist = "ai_receptionist.main:main"
ai-receptionist-web = "ai_receptionist.web:run"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_receptionist"]
